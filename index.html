<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kaç Kat?</title>
<style>
  :root { --paper: #faf7f0; --ink: #1f1d1a; --accent: #ff6a2b; --safe: #1f9d5a; }
  html, body {
    margin: 0; height: 100%; background: #e6e1d6; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 16px; box-sizing: border-box; background: rgba(31, 29, 26, .22);
  }
  .overlay.show { display: flex; }
  #menu { background: transparent; align-items: flex-start; padding-top: 22%; }
  .card {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 18px;
    box-shadow: 5px 5px 0 var(--ink); padding: 22px 20px; width: min(300px, 88%);
    box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
    gap: 10px; text-align: center;
  }
  h1 { margin: 0; font-size: 44px; font-weight: 900; letter-spacing: -1px; }
  h2 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -.5px; }
  .sub { font-size: 15px; margin: 0; opacity: .8; }
  .small { font-size: 13px; margin: 0; opacity: .7; line-height: 1.4; }
  .big { font-size: 64px; font-weight: 900; line-height: 1; margin: 0; letter-spacing: -2px; }
  .rule { width: 100%; border: 0; border-top: 1.5px dashed var(--ink); opacity: .35; margin: 4px 0; }
  .badge { border: 2px solid var(--ink); background: #ffd84a; font-weight: 800; padding: 4px 10px; border-radius: 999px; font-size: 13px; }
  button {
    font: inherit; font-weight: 800; font-size: 18px; border: 2px solid var(--ink); border-radius: 12px;
    padding: 13px 16px; width: 100%; cursor: pointer; color: var(--paper); background: var(--ink);
    box-shadow: 3px 3px 0 var(--ink); touch-action: manipulation; letter-spacing: .5px;
  }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn-save { background: var(--safe); }
  .btn-cont { background: var(--accent); }
  .btn-ghost { background: var(--paper); color: var(--ink); font-size: 15px; padding: 10px; }
  #timerBar { width: 100%; height: 8px; border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; box-sizing: border-box; }
  #timerFill { height: 100%; width: 100%; background: var(--ink); }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>

    <div id="menu" class="overlay show">
      <div class="card">
        <h1>Kaç Kat?</h1>
        <p class="sub">Sen kaçıncı kata çıkabildin?</p>
        <p class="small" id="menuBest"></p>
        <button id="btnStart">BAŞLA</button>
        <p class="small">Dokun → karşı balkona zıpla.<br>Her 5 katta: kaydet ya da riske devam et.</p>
        <p class="small" style="font-size:11px;opacity:.5">Test sürümü · anonim oyun verisi toplanır</p>
      </div>
    </div>

    <div id="decision" class="overlay">
      <div class="card">
        <h2>GÜVENLİ KAT</h2>
        <p class="sub" id="decInfo"></p>
        <div id="timerBar"><div id="timerFill"></div></div>
        <button class="btn-save" id="btnSave">KAYDET VE ÇIK</button>
        <button class="btn-cont" id="btnCont">DEVAM ET</button>
        <p class="small">Süre dolarsa tırmanış devam eder.</p>
      </div>
    </div>

    <div id="result" class="overlay">
      <div class="card">
        <h2 id="resTitle"></h2>
        <p class="small">Ulaşılan kat</p>
        <p class="big" id="resFloor"></p>
        <p class="sub" id="resScore"></p>
        <div id="resBadges" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center"></div>
        <hr class="rule">
        <p class="small" id="resBest"></p>
        <button id="btnAgain">TEKRAR OYNA</button>
        <button class="btn-ghost" id="btnShare">PAYLAŞ</button>
      </div>
    </div>

    <div id="stats" class="overlay">
      <div class="card">
        <h2>Test özeti</h2>
        <p class="small">Bu cihazda oynanan turlar</p>
        <table id="statsBody" style="width:100%;font-size:13px;border-collapse:collapse"></table>
        <button id="btnStatsClose">KAPAT</button>
      </div>
    </div>

    <div id="paused" class="overlay">
      <div class="card">
        <h2>DURAKLATILDI</h2>
        <button id="btnResume">DEVAM</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

// ------------------------------------------------------------------
// Ayarlar — denge testleri için tüm sayılar burada
// ------------------------------------------------------------------
const CFG = {
  W: 360,
  wallL: 40, wallR: 320,     // iki binanın cepheleri; aradaki boşlukta tırmanılır
  gravity: 2200,
  jumpV: 900,                // tepe yüksekliği = jumpV² / (2·gravity) ≈ 184
  jumpVX: 210,               // zıplamanın yatay hızı (her zaman karşı tarafa)
  gap: 130,                  // katlar arası dikey mesafe
  charW: 16, charH: 34,
  baseWalk: 110, maxWalk: 210,
  zoneStart: 75, zoneMin: 30, // balkonun "başarılı zıplama" bölgesinin uzunluğu (px)
  minWidth: 44, maxWidth: 150,
  gondolaWidth: 64, gondolaMinWidth: 48,
  safeEvery: 5,
  decisionTime: 3,
  pointBase: 100, multStep: 0.1,
  landTolerance: 4,          // platform kenarından bu kadar taşsa da iniş sayılır (px)
};
const W = CFG.W, WL = CFG.wallL, WR = CFG.wallR;
const X_MIN = WL + CFG.charW / 2, X_MAX = WR - CFG.charW / 2;
// Bir üst kata iniş anına kadar havada geçen süre ve bu sürede alınan yatay yol
const AIR_T = (CFG.jumpV + Math.sqrt(CFG.jumpV ** 2 - 2 * CFG.gravity * CFG.gap)) / CFG.gravity;
const JUMP_D = CFG.jumpVX * AIR_T;

// Kata göre zorluk: bir üst sınıra yaklaşan eğriler
function diff(f) {
  const k = 1 - Math.exp(-f / 25);
  return {
    walk: CFG.baseWalk + (CFG.maxWalk - CFG.baseWalk) * k,
    zone: CFG.zoneMin + (CFG.zoneStart - CFG.zoneMin) * Math.exp(-f / 18),
    gondolaChance: f < 6 ? 0 : Math.min(0.35, 0.1 + (f - 6) * 0.015),
    gondolaSpeed: 0.9 + 1.1 * k,  // rad/s
    gondolaWidth: CFG.gondolaMinWidth + (CFG.gondolaWidth - CFG.gondolaMinWidth) * (1 - k),
  };
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ------------------------------------------------------------------
// Kayıt (cihazda)
// ------------------------------------------------------------------
const store = {
  get(k, d) { try { const v = localStorage.getItem('kk_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('kk_' + k, JSON.stringify(v)); } catch (e) {} },
};
let highestFloor = store.get('highestFloor', 0);
let bestSafeScore = store.get('bestSafeScore', 0);

// ------------------------------------------------------------------
// Anonim test verisi
// posthogKey boşken hiçbir şey gönderilmez; özet yalnızca cihazda tutulur
// (menüde başlığa 5 kez dokununca görünür). Kişisel bilgi toplanmaz.
// ------------------------------------------------------------------
const ANALYTICS = {
  posthogKey: 'phc_usRMsECwAcaSBCcmqEiCxc3kXTcvdGExyjbo5qzE3Uds', // herkese açık proje anahtarı (yalnızca veri gönderir)
  host: 'https://eu.i.posthog.com',
  build: 'proto-2',
};
const analytics = (() => {
  let id = store.get('anonId', null);
  if (!id) {
    id = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
    store.set('anonId', id);
  }
  const sessionId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  let queue = [];
  const local = store.get('localStats', { runs: 0, saved: 0, fell: 0, totalSec: 0, floors: [], decisions: { save: 0, continue: 0, timeout: 0 }, quickReplays: 0 });

  function track(event, props = {}) {
    queue.push({
      event,
      properties: { distinct_id: id, $session_id: sessionId, $process_person_profile: false, build: ANALYTICS.build, ...props },
      timestamp: new Date().toISOString(),
    });
    if (queue.length > 200) queue.shift();
  }
  function flush() {
    if (!ANALYTICS.posthogKey) { queue = []; return; }
    if (!queue.length) return;
    const body = JSON.stringify({ api_key: ANALYTICS.posthogKey, batch: queue });
    queue = [];
    try {
      fetch(ANALYTICS.host + '/batch/', { method: 'POST', body, keepalive: true, headers: { 'Content-Type': 'application/json' } }).catch(() => {});
    } catch (e) {}
  }
  function recordRun(r) {
    local.runs++;
    local[r.outcome]++;
    local.totalSec += r.duration_sec;
    local.floors.push(r.floor);
    if (local.floors.length > 300) local.floors.shift();
    store.set('localStats', local);
  }
  function recordDecision(choice) { local.decisions[choice]++; store.set('localStats', local); }
  function recordQuickReplay() { local.quickReplays++; store.set('localStats', local); }
  return { track, flush, recordRun, recordDecision, recordQuickReplay, local };
})();

// Tur içi ölçümler
const runStats = { index: 0, startT: 0, jumps: 0, nearMisses: 0, firstJumpSec: null, decisionT: 0, resultT: 0 };

// ------------------------------------------------------------------
// Ses ve titreşim
// ------------------------------------------------------------------
let actx = null;
let muted = store.get('muted', false);
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function tone(freq, dur, type = 'square', vol = 0.08, slideTo = null, delay = 0) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfx = {
  jump() { tone(420, 0.12, 'square', 0.04, 700); },
  bonk() { tone(160, 0.06, 'square', 0.05); },
  land(f) { tone(Math.min(1800, 700 + f * 18), 0.06, 'triangle', 0.12); },
  nearMiss() { tone(1500, 0.05, 'sine', 0.1); tone(2000, 0.08, 'sine', 0.1, null, 0.06); },
  safe() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.14, 'triangle', 0.1, null, i * 0.08)); },
  fall() { tone(600, 0.6, 'sawtooth', 0.05, 90); },
  saved() { [784, 988, 1175].forEach((f, i) => tone(f, 0.18, 'triangle', 0.1, null, i * 0.1)); },
  record() { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.16, 'square', 0.05, null, 0.3 + i * 0.09)); },
};
function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

// ------------------------------------------------------------------
// Ekran ölçekleme: genişlik sabit 360, yükseklik ekrana göre
// ------------------------------------------------------------------
const stage = document.getElementById('stage');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let H = 640, scale = 1, dpr = 1;
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const sw = Math.min(vw, vh * 0.62), sh = vh;
  if (!(sw > 0 && sh > 0)) return; // görünmez pencerede ölçü gelmeyebilir
  stage.style.width = sw + 'px';
  stage.style.height = sh + 'px';
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(sw * dpr);
  cv.height = Math.round(sh * dpr);
  scale = sw / W;
  H = sh / scale;
}
window.addEventListener('resize', resize);
resize();

// ------------------------------------------------------------------
// Platformlar
// side: 'G' zemin, 'L' sol binanın balkonu, 'R' sağ binanın balkonu,
//       'M' iki bina arasında sağa-sola giden cam silme iskelesi
// ------------------------------------------------------------------
let state = 'ANA_MENU'; // ANA_MENU | OYUN | GUVENLI_KAT_KARARI | DUSME | SONUC | DURAKLATILDI
let rng = Math.random;
let plats, cur, ch, camY, worldT, runScore, multiplier, decisionLeft, fallTimer, popups, particles, firstJumpDone, shake;

// Platformun hareketi boyunca kapladığı en geniş yatay aralık
function sweep(p) { return [p.minC - p.w / 2, p.maxC + p.w / 2]; }

// Yeni platform her zaman bir öncekinden ulaşılabilir üretilir.
// Karakter önceki platformda [lo+m, hi-m] arasında gezer, zıplayınca `dir` yönünde JUMP_D
// kadar yol alır; karşı duvara çarparsa duvarda kalır. Duvara bağlı balkonun genişliği,
// başarılı zıplama bölgesi tam `zone` px olacak şekilde hesaplanır.
function makePlatform(i) {
  const prev = plats[plats.length - 1];
  const Dn = diff(i);
  const safe = i % CFG.safeEvery === 0;
  const m = CFG.charW * 0.3, ov = 8;

  let side;
  if (!safe && prev.side !== 'M' && i > 1 && rng() < Dn.gondolaChance) side = 'M';
  else if (prev.side === 'L') side = 'R';
  else if (prev.side === 'R') side = 'L';
  else side = rng() < 0.5 ? 'L' : 'R';

  let dir;
  if (side === 'R') dir = 1;
  else if (side === 'L') dir = -1;
  else dir = prev.side === 'L' ? 1 : prev.side === 'R' ? -1 : (rng() < 0.5 ? 1 : -1);

  const [lo, hi] = sweep(prev);
  // iniş aralığı (karşı duvar hesaba katılmadan)
  const a = Math.max(lo + m, X_MIN) + dir * JUMP_D, b = Math.min(hi - m, X_MAX) + dir * JUMP_D;
  const zone = Dn.zone * (safe ? 1.6 : 1) * (0.85 + rng() * 0.3);
  const p = { i, Y: i * CFG.gap, side, dir, safe, amp: 0, omega: 0, phase: 0 };

  if (side === 'R') {
    let w = clamp(WR - (b - zone), CFG.minWidth, CFG.maxWidth);
    w = Math.max(w, WR - Math.min(b, X_MAX) + ov);
    p.w = w; p.base = WR - w / 2;
  } else if (side === 'L') {
    let w = clamp((a + zone) - WL, CFG.minWidth, CFG.maxWidth);
    w = Math.max(w, Math.max(a, X_MIN) - WL + ov);
    p.w = w; p.base = WL + w / 2;
  } else {
    const w = Dn.gondolaWidth;
    const la = clamp(a, X_MIN, X_MAX), lb = clamp(b, X_MIN, X_MAX);
    const edge = WL + w / 2 + 8, edgeR = WR - w / 2 - 8;
    const cmin = Math.max(la, edge), cmax = Math.min(lb, edgeR);
    const c = cmin <= cmax ? cmin + rng() * (cmax - cmin) : clamp((la + lb) / 2, edge, edgeR);
    const maxAmp = Math.min(c - edge, edgeR - c, 90);
    p.w = w; p.base = c;
    if (maxAmp > 15) {
      p.amp = 15 + rng() * (maxAmp - 15);
      p.omega = Dn.gondolaSpeed * (0.8 + rng() * 0.4);
      p.phase = rng() * Math.PI * 2;
    }
  }
  p.x = p.base;
  p.minC = p.base - p.amp; p.maxC = p.base + p.amp;
  return p;
}

function resetRun() {
  rng = mulberry32((Date.now() ^ (Math.random() * 1e9)) >>> 0);
  const gw = WR - WL;
  plats = [{ i: 0, Y: 0, side: 'G', w: gw, base: W / 2, x: W / 2, minC: W / 2, maxC: W / 2, amp: 0, omega: 0, phase: 0 }];
  for (let i = 1; i <= 12; i++) plats.push(makePlatform(i));
  cur = 0;
  ch = { x: W / 2, Y: 0, vx: 0, vy: 0, dir: 1, face: 1, relX: 0, standing: true, walk: diff(0).walk, squash: 0, phase: 0 };
  camY = 0; worldT = 0; runScore = 0; multiplier = 1;
  fallTimer = 0; popups = []; particles = []; firstJumpDone = false; shake = 0;
}

function platById(i) { return plats.find(p => p.i === i); }

function startRun() {
  initAudio();
  const now = performance.now();
  const sinceResult = runStats.resultT ? (now - runStats.resultT) / 1000 : null;
  if (sinceResult != null && sinceResult < 10) analytics.recordQuickReplay();
  Object.assign(runStats, { index: runStats.index + 1, startT: now, jumps: 0, nearMisses: 0, firstJumpSec: null });
  analytics.track('run_start', {
    run_index: runStats.index,
    since_last_result_sec: sinceResult == null ? null : Math.round(sinceResult * 10) / 10,
  });
  resetRun();
  state = 'OYUN';
  show(null);
}

function jump() {
  if (state !== 'OYUN' || !ch.standing) return;
  const q = platById(cur + 1);
  ch.standing = false;
  ch.vx = q.dir * CFG.jumpVX;
  ch.vy = CFG.jumpV;
  ch.face = q.dir;
  ch.squash = -0.6;
  firstJumpDone = true;
  runStats.jumps++;
  if (runStats.firstJumpSec == null) runStats.firstJumpSec = Math.round((performance.now() - runStats.startT) / 100) / 10;
  sfx.jump();
}

function land(p) {
  ch.standing = true;
  ch.Y = p.Y; ch.vy = 0; ch.vx = 0;
  const lim = p.w / 2 - CFG.charW * 0.3;
  ch.relX = clamp(ch.x - p.x, -lim, lim);
  // balkonda dışa (boşluğa) doğru değil, duvara doğru yürümeye başla
  ch.dir = p.side === 'L' ? -1 : p.side === 'R' ? 1 : ch.face;
  ch.squash = 1;
  cur = p.i;

  const gained = Math.round(CFG.pointBase * multiplier);
  runScore += gained;
  multiplier = Math.round((multiplier + CFG.multStep) * 10) / 10;
  ch.walk = diff(cur).walk;

  // boşluğa bakan kenara çok yakın iniş = kıl payı
  const inner = p.side === 'L' ? p.x + p.w / 2 : p.side === 'R' ? p.x - p.w / 2 : null;
  const near = inner == null
    ? Math.abs(ch.x - p.x) > p.w / 2 - 5
    : Math.abs(ch.x - inner) < 6;
  addPopup('+' + gained, ch.x, ch.Y + 52, 'ink');
  if (near) { runStats.nearMisses++; addPopup('KIL PAYI!', ch.x, ch.Y + 78, 'accent'); sfx.nearMiss(); shake = 6; }
  sfx.land(cur);
  vibrate(12);
  for (let k = 0; k < 6; k++) particles.push({ x: ch.x, Y: ch.Y, vx: (rng() - 0.5) * 160, vy: rng() * 120, life: 0.35 });

  while (plats[plats.length - 1].i < cur + 12) plats.push(makePlatform(plats[plats.length - 1].i + 1));
  while (plats[0].i < cur - 4) plats.shift();

  if (p.safe) {
    sfx.safe();
    vibrate([30, 40, 30]);
    state = 'GUVENLI_KAT_KARARI';
    decisionLeft = CFG.decisionTime;
    runStats.decisionT = performance.now();
    document.getElementById('decInfo').innerHTML =
      `<b>${cur}. kat</b> · <b>${runScore}</b> puan<br><span style="font-size:13px">Düşersen bu puanı kaybedersin.</span>`;
    document.getElementById('btnCont').textContent = `DEVAM ET  ×${multiplier.toFixed(1)}`;
    show('decision');
  }
}

let lastReached = 0;
function endRun(saved) {
  state = 'SONUC';
  lastReached = cur;
  const run = {
    run_index: runStats.index,
    outcome: saved ? 'saved' : 'fell',
    floor: cur,
    score: runScore,
    duration_sec: Math.round((performance.now() - runStats.startT) / 100) / 10,
    jumps: runStats.jumps,
    first_jump_sec: runStats.firstJumpSec,
    near_misses: runStats.nearMisses,
    fell_from_side: saved ? null : platById(cur + 1)?.side ?? null,
    best_floor_before: highestFloor,
    new_floor_record: cur > highestFloor,
  };
  analytics.track('run_end', run);
  analytics.recordRun(run);
  analytics.flush();
  runStats.resultT = performance.now();
  const badges = [];
  if (cur > highestFloor) { highestFloor = cur; store.set('highestFloor', cur); badges.push('YENİ KAT REKORU'); }
  if (saved && runScore > bestSafeScore) { bestSafeScore = runScore; store.set('bestSafeScore', runScore); badges.push('EN İYİ GÜVENLİ PUAN'); }

  document.getElementById('resTitle').textContent = saved ? 'Kaydedildi' : 'Düştün!';
  document.getElementById('resFloor').textContent = cur;
  document.getElementById('resScore').innerHTML = saved
    ? `<b style="color:var(--safe)">+${runScore} puan</b> güvende`
    : (runScore > 0 ? `<b style="color:var(--accent)">${runScore} puan</b> kaybedildi` : 'Puan kaydedilmedi');
  document.getElementById('resBadges').innerHTML = badges.map(b => `<span class="badge">${b}</span>`).join('');
  document.getElementById('resBest').textContent = `En yüksek kat ${highestFloor} · En iyi güvenli puan ${bestSafeScore}`;
  document.getElementById('btnShare').textContent = 'PAYLAŞ';
  if (saved) sfx.saved();
  if (badges.length) sfx.record();
  show('result');
}

// ------------------------------------------------------------------
// Simülasyon
// ------------------------------------------------------------------
function step(dt) {
  worldT += dt;
  for (const p of plats) if (p.amp) p.x = p.base + p.amp * Math.sin(p.phase + p.omega * worldT);

  if (ch.standing) {
    const p = platById(cur);
    const lim = p.w / 2 - CFG.charW * 0.3;
    ch.relX += ch.dir * ch.walk * dt;
    if (ch.relX > lim) { ch.relX = lim; ch.dir = -1; }
    if (ch.relX < -lim) { ch.relX = -lim; ch.dir = 1; }
    // duvara bitişik balkonda karakter duvarın içine girmesin
    if (p.x + ch.relX < X_MIN) { ch.relX = X_MIN - p.x; ch.dir = 1; }
    if (p.x + ch.relX > X_MAX) { ch.relX = X_MAX - p.x; ch.dir = -1; }
    ch.x = p.x + ch.relX;
    ch.Y = p.Y;
    ch.face = ch.dir;
    ch.phase += ch.walk * dt * 0.11;
    return;
  }

  const prevY = ch.Y;
  ch.vy -= CFG.gravity * dt;
  ch.x += ch.vx * dt;
  ch.Y += ch.vy * dt;
  // binaların cepheleri: çarpınca duvarda kalır ve aşağı kayar
  if ((ch.x < X_MIN && ch.vx <= 0) || (ch.x > X_MAX && ch.vx >= 0)) {
    ch.x = clamp(ch.x, X_MIN, X_MAX);
    if (ch.vx !== 0) { ch.vx = 0; if (state === 'OYUN') sfx.bonk(); }
  }
  if (state !== 'OYUN') return;

  const q = platById(cur + 1);
  if (q && ch.vy < 0 && prevY >= q.Y && ch.Y <= q.Y &&
      Math.abs(ch.x - q.x) <= q.w / 2 + CFG.landTolerance) {
    land(q);
    return;
  }
  if (ch.Y < platById(cur).Y - 40) {
    state = 'DUSME';
    fallTimer = 1.0;
    sfx.fall();
    vibrate(200);
    shake = 10;
  }
}

function update(dt) {
  ch.squash *= Math.pow(0.0005, dt);
  shake = Math.max(0, shake - dt * 30);
  for (const pp of popups) { pp.Y += 40 * dt; pp.life -= dt; }
  popups = popups.filter(pp => pp.life > 0);
  for (const pa of particles) { pa.x += pa.vx * dt; pa.Y += pa.vy * dt; pa.vy -= 600 * dt; pa.life -= dt; }
  particles = particles.filter(pa => pa.life > 0);

  if (state === 'OYUN' || state === 'DUSME') {
    const sub = 4, h = dt / sub;
    for (let s = 0; s < sub; s++) step(h);
  }
  if (state === 'OYUN' || state === 'GUVENLI_KAT_KARARI') {
    camY += (platById(cur).Y - camY) * Math.min(1, dt * 6);
  }
  if (state === 'DUSME') {
    fallTimer -= dt;
    if (fallTimer <= 0) endRun(false);
  }
  if (state === 'GUVENLI_KAT_KARARI') {
    decisionLeft -= dt;
    document.getElementById('timerFill').style.width = Math.max(0, decisionLeft / CFG.decisionTime * 100) + '%';
    if (decisionLeft <= 0) continueRun('timeout');
  }
}

function trackDecision(choice) {
  analytics.track('safe_decision', {
    run_index: runStats.index,
    floor: cur,
    choice,
    run_score: runScore,
    decision_ms: Math.round(performance.now() - runStats.decisionT),
  });
  analytics.recordDecision(choice);
}

function continueRun(choice = 'continue') {
  if (state !== 'GUVENLI_KAT_KARARI') return;
  trackDecision(choice);
  state = 'OYUN';
  show(null);
}

function addPopup(text, x, Y, color) { popups.push({ text, x, Y, color, life: 0.9 }); }

// ------------------------------------------------------------------
// Çizim — çizgi (line-art) stili: kâğıt zemin, tek renk mürekkep, az vurgu rengi
// ------------------------------------------------------------------
const SKY = [
  { f: 0,  top: [243, 239, 230], bot: [236, 230, 218] },  // kâğıt
  { f: 15, top: [222, 233, 243], bot: [243, 238, 228] },  // açık gökyüzü
  { f: 30, top: [246, 214, 190], bot: [244, 229, 207] },  // gün batımı
  { f: 50, top: [28, 33, 56],    bot: [44, 46, 74] },     // gece
  { f: 75, top: [6, 6, 14],      bot: [18, 20, 40] },     // uzay
];
const INK_DARK = '#1f1d1a', INK_LIGHT = '#ece8de';
const ACCENT = '#ff6a2b', SAFE = '#1f9d5a';
function palette(f) {
  let a = SKY[SKY.length - 1], b = a;
  for (let k = 0; k < SKY.length - 1; k++) if (f < SKY[k + 1].f) { a = SKY[k]; b = SKY[k + 1]; break; }
  const t = a === b ? 0 : clamp((f - a.f) / (b.f - a.f), 0, 1);
  const top = a.top.map((v, i) => lerp(v, b.top[i], t));
  const bot = a.bot.map((v, i) => lerp(v, b.bot[i], t));
  const lum = (top[0] * 0.3 + top[1] * 0.59 + top[2] * 0.11) / 255;
  const css = c => `rgb(${c.map(Math.round).join(',')})`;
  return { top: css(top), bot: css(bot), ink: lum > 0.45 ? INK_DARK : INK_LIGHT };
}

function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

let ink = INK_DARK;
function render() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const anchor = H * 0.66;
  const jx = shake ? (Math.random() - 0.5) * shake : 0;
  const jy = shake ? (Math.random() - 0.5) * shake : 0;
  const sy = Y => anchor - (Y - camY) + jy;
  const camFloor = camY / CFG.gap;
  const pal = palette(camFloor);
  ink = pal.ink;

  // gökyüzü
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, pal.top); g.addColorStop(1, pal.bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(jx, 0);
  drawBackdrop(camFloor, anchor);
  drawBuildings(sy);

  // sokak
  const gy = sy(0);
  if (gy < H + 10) {
    ctx.strokeStyle = ink; ctx.lineWidth = 2;
    line(0, gy, W, gy);
    ctx.lineWidth = 1.5; ctx.globalAlpha = 0.5;
    ctx.setLineDash([14, 12]); line(WL + 10, gy + 34, WR - 10, gy + 34); ctx.setLineDash([]);
    line(0, gy + 10, W, gy + 10);
    ctx.globalAlpha = 1;
  }

  for (const p of plats) {
    if (p.side === 'G') continue;
    const y = sy(p.Y);
    if (y < -40 || y > H + 40) continue;
    drawPlatform(p, y);
  }

  ctx.strokeStyle = ink; ctx.lineWidth = 1.5;
  for (const pa of particles) {
    const y = sy(pa.Y);
    line(pa.x, y, pa.x - pa.vx * 0.03, y + pa.vy * 0.03);
  }

  drawChar(ch.x, sy(ch.Y));

  ctx.textAlign = 'center';
  for (const pp of popups) {
    ctx.globalAlpha = Math.min(1, pp.life * 2);
    ctx.font = '800 17px system-ui';
    ctx.fillStyle = pp.color === 'accent' ? ACCENT : ink;
    ctx.fillText(pp.text, pp.x, sy(pp.Y));
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (state !== 'ANA_MENU') drawHUD();
}

// Uzaktaki şehir silüeti, bulutlar ve yıldızlar — hepsi ince çizgi
function drawBackdrop(camFloor, anchor) {
  ctx.strokeStyle = ink; ctx.lineWidth = 1.2;
  // silüet: yavaş kayan (parallax) arka plan
  const base = anchor + camY * 0.3;
  if (base - 260 < H) {
    ctx.globalAlpha = 0.18;
    const hs = [120, 190, 90, 240, 150, 200, 110];
    for (let k = 0; k < hs.length; k++) {
      const x = WL + 6 + k * 40, h = hs[k];
      ctx.strokeRect(x, base - h, 32, h);
      for (let yy = base - h + 14; yy < base - 10; yy += 18) line(x + 8, yy, x + 24, yy);
    }
    ctx.globalAlpha = 1;
  }
  // bulutlar
  if (camFloor > 8 && camFloor < 55) {
    ctx.globalAlpha = 0.22 * Math.min(1, (camFloor - 8) / 6) * Math.min(1, (55 - camFloor) / 6);
    for (let k = 0; k < 6; k++) {
      const x = WL + 20 + ((k * 83) % 230);
      const y = ((k * 157 + camY * 0.5) % (H + 80)) - 40;
      ctx.beginPath();
      ctx.arc(x, y, 10, Math.PI, 0); ctx.arc(x + 16, y - 4, 13, Math.PI, 0); ctx.arc(x + 34, y, 9, Math.PI, 0);
      ctx.lineTo(x - 10, y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // yıldızlar
  if (camFloor > 42) {
    ctx.globalAlpha = Math.min(1, (camFloor - 42) / 12);
    ctx.lineWidth = 1;
    for (let k = 0; k < 30; k++) {
      const x = WL + ((k * 97.3) % (WR - WL)), y = (k * 211.7 + camY * 0.1) % H;
      const s = k % 3 === 0 ? 3 : 1.5;
      line(x - s, y, x + s, y); line(x, y - s, x, y + s);
    }
    ctx.globalAlpha = 1;
  }
}

// İki bina: ekran kenarlarındaki şeritler; kat çizgileri ve pencere kenarları
function drawBuildings(sy) {
  const groundY = sy(0);
  const top = 0, bottom = Math.min(H, groundY);
  ctx.fillStyle = ink === INK_DARK ? 'rgba(31,29,26,.05)' : 'rgba(236,232,222,.06)';
  ctx.fillRect(0, top, WL, bottom - top);
  ctx.fillRect(WR, top, W - WR, bottom - top);
  ctx.strokeStyle = ink; ctx.lineWidth = 2;
  line(WL, top, WL, bottom);
  line(WR, top, WR, bottom);

  ctx.lineWidth = 1.2;
  const anchorFloorLo = Math.floor((camY - H) / CFG.gap) - 1, anchorFloorHi = Math.ceil((camY + H) / CFG.gap) + 1;
  for (let i = Math.max(0, anchorFloorLo); i <= anchorFloorHi; i++) {
    const y = sy(i * CFG.gap);
    if (y < -CFG.gap || y > bottom + CFG.gap) continue;
    ctx.globalAlpha = 0.35;
    line(0, y + 0.5, WL, y + 0.5);
    line(WR, y + 0.5, W, y + 0.5);
    // pencereler (kat arasında)
    const wy = y - CFG.gap + 38, wh = 52;
    if (wy + wh < bottom) {
      ctx.strokeRect(8, wy, 22, wh);
      line(19, wy, 19, wy + wh);
      ctx.strokeRect(W - 30, wy, 22, wh);
      line(W - 19, wy, W - 19, wy + wh);
    }
    ctx.globalAlpha = 1;
  }
}

function drawPlatform(p, y) {
  const l = p.x - p.w / 2, r = p.x + p.w / 2;
  const col = p.safe ? SAFE : ink;
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.lineWidth = 2;

  if (p.side === 'M') {
    // cam silme iskelesi: iki halat, korkuluk, döşeme
    ctx.lineWidth = 1.2; ctx.globalAlpha = 0.7;
    line(l + 4, y - 20, l + 4, -10); line(r - 4, y - 20, r - 4, -10);
    ctx.globalAlpha = 1; ctx.lineWidth = 2;
    ctx.strokeRect(l, y, p.w, 6);
    line(l, y - 20, r, y - 20);
    line(l, y - 20, l, y); line(r, y - 20, r, y);
    ctx.lineWidth = 1.2;
    line(l, y - 10, r, y - 10);
    // hareket işareti
    ctx.globalAlpha = 0.5;
    line(p.x - 6, y + 12, p.x + 6, y + 12);
    line(p.x - 6, y + 12, p.x - 3, y + 9); line(p.x - 6, y + 12, p.x - 3, y + 15);
    line(p.x + 6, y + 12, p.x + 3, y + 9); line(p.x + 6, y + 12, p.x + 3, y + 15);
    ctx.globalAlpha = 1;
    return;
  }

  const wallX = p.side === 'L' ? WL : WR, tipX = p.side === 'L' ? r : l, s = p.side === 'L' ? 1 : -1;
  // döşeme
  ctx.strokeRect(Math.min(wallX, tipX), y, p.w, 5);
  // destek dirseği
  ctx.lineWidth = 1.2;
  line(wallX, y + 18, wallX + s * Math.min(26, p.w * 0.4), y + 5);
  ctx.lineWidth = 2;
  if (p.w >= 58 || p.safe) {
    // korkuluk
    line(wallX, y - 18, tipX, y - 18);
    line(tipX, y - 18, tipX, y);
    ctx.lineWidth = 1.2;
    for (let x = wallX + s * 9; s > 0 ? x < tipX - 3 : x > tipX + 3; x += s * 9) line(x, y - 18, x, y);
  } else {
    // dar pencere çıkıntısı: korkuluksuz, küçük saksı
    ctx.lineWidth = 1.2;
    const px = wallX + s * 12;
    ctx.beginPath(); ctx.moveTo(px - 5, y - 9); ctx.lineTo(px + 5, y - 9); ctx.lineTo(px + 3, y); ctx.lineTo(px - 3, y); ctx.closePath(); ctx.stroke();
    line(px, y - 9, px - 3, y - 15); line(px, y - 9, px + 2, y - 16);
  }
  if (p.safe) {
    // ÇIKIŞ tabelası ve açık pencere
    ctx.lineWidth = 1.5;
    const dx = wallX + s * 4;
    ctx.strokeRect(Math.min(dx, dx + s * 34), y - 56, 34, 15);
    ctx.font = '800 9px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('ÇIKIŞ', dx + s * 17, y - 45);
    line(dx + s * 17, y - 41, dx + s * 17, y - 22);
  }
}

// Çöp adam
function drawChar(x, y) {
  let sxs = 1, sys = 1;
  if (ch.squash > 0) { sxs = 1 + 0.25 * ch.squash; sys = 1 - 0.25 * ch.squash; }
  else if (!ch.standing) { sys = 1.06; }
  const f = ch.face;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sxs, sys);
  ctx.strokeStyle = ink; ctx.lineWidth = 2.2;

  const hipY = -13, shY = -24, headY = -31;
  let lf, rf, la, ra;
  if (state === 'DUSME') {
    const t = performance.now() / 70;
    lf = [-6, -2 + Math.sin(t) * 3]; rf = [6, -2 - Math.sin(t) * 3];
    la = [-9, shY - 9 + Math.cos(t) * 4]; ra = [9, shY - 9 - Math.cos(t) * 4];
  } else if (!ch.standing) {
    lf = [-f * 5, -5]; rf = [f * 5, -2];
    la = [f * 9, shY - 8]; ra = [-f * 6, shY - 10];
  } else if (state === 'ANA_MENU') {
    lf = [-4, 0]; rf = [4, 0]; la = [-5, shY + 9]; ra = [5, shY + 9];
  } else {
    const s = Math.sin(ch.phase);
    lf = [s * 6, -Math.max(0, Math.cos(ch.phase)) * 3]; rf = [-s * 6, -Math.max(0, -Math.cos(ch.phase)) * 3];
    la = [-s * 6, shY + 9]; ra = [s * 6, shY + 9];
  }
  // bacaklar
  line(0, hipY, lf[0], lf[1]); line(0, hipY, rf[0], rf[1]);
  // gövde
  line(0, hipY, 0, shY);
  // kollar
  line(0, shY + 1, la[0], la[1]); line(0, shY + 1, ra[0], ra[1]);
  // baş
  ctx.fillStyle = ink === INK_DARK ? '#faf7f0' : '#1c2038';
  ctx.beginPath(); ctx.arc(0, headY, 6.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // göz
  ctx.fillStyle = ink;
  ctx.beginPath(); ctx.arc(f * 3, headY - 0.5, 1.2, 0, Math.PI * 2); ctx.fill();
  // turuncu bere (karakterin tek rengi)
  ctx.fillStyle = ACCENT; ctx.strokeStyle = ink; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, headY - 2, 6.8, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(-f * 5, headY - 8, 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = ink; ctx.strokeStyle = ink;
  ctx.textAlign = 'center';
  ctx.font = '900 44px system-ui'; ctx.fillText(cur, W / 2, 58);
  ctx.font = '700 10px system-ui'; ctx.fillText('KAT', W / 2, 72);
  // güvenli kata kalan: 5 küçük daire
  const k = cur % CFG.safeEvery;
  ctx.lineWidth = 1.5;
  for (let n = 0; n < CFG.safeEvery; n++) {
    const x = W / 2 - 20 + n * 10;
    ctx.beginPath(); ctx.arc(x, 84, 3, 0, Math.PI * 2);
    if (n < k) ctx.fill(); else ctx.stroke();
  }

  ctx.textAlign = 'left';
  ctx.font = '700 10px system-ui'; ctx.fillText('PUAN', 14, 26);
  ctx.font = '800 22px system-ui'; ctx.fillText(runScore, 14, 50);
  ctx.font = '600 10px system-ui'; ctx.globalAlpha = 0.65;
  ctx.fillText('Rekor ' + highestFloor + '. kat', 14, 66);
  ctx.globalAlpha = 1;

  ctx.textAlign = 'right';
  ctx.font = '700 10px system-ui'; ctx.fillText('ÇARPAN', W - 14, 26);
  ctx.font = '800 22px system-ui'; ctx.fillStyle = ACCENT; ctx.fillText('×' + multiplier.toFixed(1), W - 14, 50);

  if (!firstJumpDone && state === 'OYUN') {
    ctx.textAlign = 'center';
    ctx.fillStyle = ink;
    ctx.font = '800 18px system-ui';
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(performance.now() / 200);
    ctx.fillText('Dokun ve zıpla!', W / 2, H * 0.42);
    ctx.globalAlpha = 1;
  }
}

// ------------------------------------------------------------------
// Arayüz
// ------------------------------------------------------------------
const overlays = ['menu', 'decision', 'result', 'paused', 'stats'];
function show(id) { for (const o of overlays) document.getElementById(o).classList.toggle('show', o === id); }
function refreshMenu() {
  document.getElementById('menuBest').textContent =
    highestFloor ? `En yüksek kat ${highestFloor} · En iyi güvenli puan ${bestSafeScore}` : '';
}
for (const o of overlays) document.getElementById(o).addEventListener('pointerdown', e => e.stopPropagation());

document.getElementById('btnStart').onclick = startRun;
document.getElementById('btnAgain').onclick = startRun;
document.getElementById('btnSave').onclick = () => {
  if (state !== 'GUVENLI_KAT_KARARI') return;
  trackDecision('save');
  endRun(true);
};
document.getElementById('btnCont').onclick = () => continueRun('continue');
document.getElementById('btnResume').onclick = () => { state = pausedFrom; show(pausedFrom === 'GUVENLI_KAT_KARARI' ? 'decision' : null); last = performance.now(); };
document.getElementById('btnShare').onclick = async () => {
  const text = `"Kaç Kat?" oyununda ${lastReached}. kata çıktım! Sen kaçıncı kata çıkabildin?`;
  const btn = document.getElementById('btnShare');
  analytics.track('share_click', { floor: lastReached, native_share: !!navigator.share });
  analytics.flush();
  try {
    if (navigator.share) { await navigator.share({ text }); return; }
    await navigator.clipboard.writeText(text);
    btn.textContent = 'KOPYALANDI!';
  } catch (e) {}
};

stage.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
  if (e.code === 'KeyM') { muted = !muted; store.set('muted', muted); }
});

let pausedFrom = 'OYUN';
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;
  if (state === 'OYUN' || state === 'GUVENLI_KAT_KARARI') {
    pausedFrom = state; state = 'DURAKLATILDI'; show('paused');
    analytics.track('app_hidden', { run_index: runStats.index, floor: cur });
  }
  analytics.flush();
});
window.addEventListener('pagehide', () => analytics.flush());

// Gizli test özeti: menüde başlığa 5 kez dokun
let titleTaps = 0, titleTapT = 0;
document.querySelector('#menu h1').addEventListener('click', () => {
  const now = performance.now();
  titleTaps = now - titleTapT < 600 ? titleTaps + 1 : 1;
  titleTapT = now;
  if (titleTaps < 5) return;
  titleTaps = 0;
  const s = analytics.local, fl = [...s.floors].sort((a, b) => a - b);
  const median = fl.length ? fl[Math.floor(fl.length / 2)] : '-';
  document.getElementById('statsBody').innerHTML = [
    ['Tur sayısı', s.runs],
    ['Kaydedip çıkan / düşen', `${s.saved} / ${s.fell}`],
    ['Ortalama tur süresi', s.runs ? (s.totalSec / s.runs).toFixed(1) + ' sn' : '-'],
    ['Ortanca kat', median],
    ['En yüksek kat', fl.length ? fl[fl.length - 1] : '-'],
    ['Karar: kaydet / devam / süre doldu', `${s.decisions.save} / ${s.decisions.continue} / ${s.decisions.timeout}`],
    ['10 sn içinde tekrar oynama', s.quickReplays],
    ['Veri gönderimi', ANALYTICS.posthogKey ? 'açık (PostHog)' : 'kapalı (yalnızca cihaz)'],
  ].map(([k, v]) => `<tr><td style="text-align:left;padding:3px 8px 3px 0">${k}</td><td style="text-align:right;font-weight:800">${v}</td></tr>`).join('');
  show('stats');
});
document.getElementById('btnStatsClose').onclick = () => show('menu');

// ------------------------------------------------------------------
// Ana döngü
// ------------------------------------------------------------------
resetRun();
refreshMenu();
analytics.track('session_start', {
  viewport: `${window.innerWidth}x${window.innerHeight}`,
  touch: 'ontouchstart' in window,
  standalone: window.matchMedia('(display-mode: standalone)').matches,
  returning: highestFloor > 0,
});
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (!stage.style.width) resize();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
